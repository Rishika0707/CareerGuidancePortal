<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CareerGuide</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f3ff;
            color: #222;
        }

        nav {
            background: #6c4ab6;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 60px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .card h1 {
            text-align: center;
            color: #6c4ab6;
            margin-bottom: 10px;
        }

        .card p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #6c4ab6;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #6c4ab6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #563798;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .error {
            background: #ffe5e5;
            color: #c62828;
        }

        .success {
            background: #e5f7e9;
            color: #218838;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
        }

        .login-link a {
            color: #6c4ab6;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            background: #eee9ff;
            color: #555;
        }

        @media (max-width: 600px) {
            nav {
                padding: 15px 5%;
            }

            nav a {
                margin-left: 10px;
                font-size: 14px;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>CareerGuide</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="container">

        <div class="card">

            <h1>Create Account</h1>

            <p>Register to start your career journey</p>

            <div id="errorMessage" class="message error"></div>

            <div id="successMessage" class="message success"></div>

            <form onsubmit="registerUser(event)">

                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </div>

        </div>

    </div>

    <footer>
        © 2026 CareerGuide. All rights reserved.
    </footer>


    <script>

        async function registerUser(event) {

            event.preventDefault();

            const fullName =
                document.getElementById("fullName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const errorMessage =
                document.getElementById("errorMessage");

            const successMessage =
                document.getElementById("successMessage");


            // Hide previous messages
            errorMessage.style.display = "none";
            successMessage.style.display = "none";


            // Check password
            if (password !== confirmPassword) {

                errorMessage.textContent =
                    "Passwords do not match.";

                errorMessage.style.display = "block";

                document.getElementById("confirmPassword").value = "";

                document.getElementById("confirmPassword").focus();

                return;
            }


            try {

                const response = await fetch("/api/register", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        fullName: fullName,
                        email: email,
                        password: password
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    errorMessage.textContent =
                        data.message || "Registration failed.";

                    errorMessage.style.display = "block";

                    return;
                }


                // Registration successful

                successMessage.textContent =
                    "Registration successful! Redirecting to login...";

                successMessage.style.display = "block";


                // Save user ID for later
                localStorage.setItem("userId", data.userId);

                localStorage.setItem("userName", fullName);

                localStorage.setItem("userEmail", email);


                setTimeout(function () {

                    window.location.href = "login.html";

                }, 1000);


            } catch (error) {

                console.error(error);

                errorMessage.textContent =
                    "Cannot connect to the server. Make sure the Node.js server is running.";

                errorMessage.style.display = "block";

            }

        }

    </script>

</body>
</html>
