<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CareerGuide</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f3ff;
            color: #222;
        }

        nav {
            background: #6c4ab6;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 60px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .card h1 {
            text-align: center;
            color: #6c4ab6;
            margin-bottom: 10px;
        }

        .card p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #6c4ab6;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #6c4ab6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #563798;
        }

        button:disabled {
            background: #9a86c9;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .error {
            background: #ffe5e5;
            color: #c62828;
        }

        .success {
            background: #e5f7e9;
            color: #218838;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
        }

        .register-link a {
            color: #6c4ab6;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            background: #eee9ff;
            color: #555;
        }

        @media (max-width: 600px) {

            nav {
                padding: 15px 5%;
            }

            nav a {
                margin-left: 10px;
                font-size: 14px;
            }

            .card {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVIGATION ================= -->

    <nav>

        <h2>CareerGuide</h2>

        <div>

            <a href="index.html">Home</a>

            <a href="about.html">About</a>

            <a href="register.html">Register</a>

        </div>

    </nav>


    <!-- ================= LOGIN ================= -->

    <div class="container">

        <div class="card">

            <h1>Welcome Back</h1>

            <p>
                Login to continue your career journey
            </p>


            <!-- Error -->

            <div
                id="errorMessage"
                class="message error">
            </div>


            <!-- Success -->

            <div
                id="successMessage"
                class="message success">
            </div>


            <form id="loginForm">


                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton">

                    Login

                </button>


            </form>


            <!-- REGISTER -->

            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Register here
                </a>

            </div>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 Career Guidance Portal

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script>


        // Get form elements

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const errorMessage =
            document.getElementById("errorMessage");

        const successMessage =
            document.getElementById("successMessage");


        // =====================================================
        // LOGIN
        // =====================================================

        loginForm.addEventListener(
            "submit",
            loginUser
        );


        async function loginUser(event) {

            event.preventDefault();


            // -------------------------------------------------
            // Get values
            // -------------------------------------------------

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            // -------------------------------------------------
            // Clear old messages
            // -------------------------------------------------

            errorMessage.textContent = "";
            errorMessage.style.display = "none";

            successMessage.textContent = "";
            successMessage.style.display = "none";


            // -------------------------------------------------
            // Disable button
            // -------------------------------------------------

            loginButton.disabled = true;

            loginButton.textContent =
                "Logging in...";


            try {


                // =================================================
                // SEND LOGIN REQUEST
                // =================================================

                const response = await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            email: email,

                            password: password

                        })
                    }
                );


                // =================================================
                // READ SERVER RESPONSE
                // =================================================

                const data =
                    await response.json();


                console.log(
                    "Login API response:",
                    data
                );


                // =================================================
                // LOGIN FAILED
                // =================================================

                if (
                    !response.ok ||
                    !data.success
                ) {

                    errorMessage.textContent =
                        data.message ||
                        "Invalid email or password.";

                    errorMessage.style.display =
                        "block";


                    passwordInput.value = "";

                    passwordInput.focus();


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";


                    return;
                }


                // =================================================
                // LOGIN SUCCESSFUL
                // =================================================

                /*
                    IMPORTANT:

                    Your current server.js returns:

                    data.userId
                    data.fullName
                    data.email

                    NOT:

                    data.user.id
                */


                const userId =
                    data.userId;

                const userName =
                    data.fullName;

                const userEmail =
                    data.email;


                // -------------------------------------------------
                // Make sure user ID exists
                // -------------------------------------------------

                if (!userId) {

                    console.error(
                        "Login response:",
                        data
                    );

                    throw new Error(
                        "Server did not return a user ID."
                    );
                }


                // =================================================
                // SAVE LOGIN INFORMATION
                // =================================================

                localStorage.setItem(
                    "userId",
                    userId
                );


                localStorage.setItem(
                    "userName",
                    userName || ""
                );


                localStorage.setItem(
                    "userEmail",
                    userEmail || email
                );


                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );


                // =================================================
                // SHOW SUCCESS
                // =================================================

                successMessage.textContent =
                    "Login successful! Redirecting...";

                successMessage.style.display =
                    "block";


                // =================================================
                // REDIRECT
                // =================================================

                setTimeout(
                    function () {

                        window.location.href =
                            "profile.html";

                    },
                    700
                );

            }


            // =================================================
            // ERROR
            // =================================================

            catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                errorMessage.textContent =
                    "Unable to complete login. Please check that the server is running and try again.";

                errorMessage.style.display =
                    "block";


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

            }

        }

    </script>

</body>

</html>
