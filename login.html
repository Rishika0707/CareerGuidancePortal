<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CareerGuide</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #222;
        }

        nav {
            background: #6c3fdc;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        .container {
            max-width: 450px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #6c3fdc;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #6c3fdc;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5830bd;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #6c3fdc;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">CareerGuide</div>

    <div>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
    </div>
</nav>

<div class="container">

    <h1>Login</h1>

    <p class="subtitle">
        Login to continue your career journey.
    </p>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" id="loginButton">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Register here</a>
    </div>

</div>

<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        const loginButton =
            document.getElementById("loginButton");

        message.textContent = "Logging in...";
        message.style.color = "#6c3fdc";

        loginButton.disabled = true;

        try {

            const response = await fetch("/api/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })

            });

            const data = await response.json();

            if (!response.ok || !data.success) {

                message.textContent =
                    data.message || "Login failed.";

                message.style.color = "red";

                loginButton.disabled = false;

                return;
            }

            /*
             * The server returns:
             *
             * data.user = {
             *     id,
             *     full_name,
             *     email
             * }
             */

            if (!data.user || !data.user.id) {

                message.textContent =
                    "Login successful, but user information was not received.";

                message.style.color = "red";

                loginButton.disabled = false;

                return;
            }

            /*
             * IMPORTANT:
             * Save the complete user object.
             *
             * profile.html checks localStorage for "user".
             */

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );

            /*
             * Keep these values too.
             * They may be useful for other pages.
             */

            localStorage.setItem(
                "userId",
                String(data.user.id)
            );

            localStorage.setItem(
                "userEmail",
                data.user.email || email
            );

            localStorage.setItem(
                "userName",
                data.user.full_name || ""
            );

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );

            /*
             * Store the user ID cookie as well.
             */

            document.cookie =
                "career_user_id=" +
                encodeURIComponent(data.user.id) +
                "; path=/; SameSite=Lax";

            message.textContent =
                "Login successful!";

            message.style.color = "green";

            /*
             * Open the career profile page.
             */

            setTimeout(function() {

                window.location.href =
                    "profile.html";

            }, 500);

        } catch (error) {

            console.error(
                "Login error:",
                error
            );

            message.textContent =
                "Could not connect to the server.";

            message.style.color = "red";

            loginButton.disabled = false;
        }

    });

</script>

</body>
</html>
