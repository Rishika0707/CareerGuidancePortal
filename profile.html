<script>

    /*

    /*
     * ============================================================
     * CREATE SKILL OPTIONS
     * ============================================================
     */

    function createSkillOptions(selectedSkill = "") {

        let html = `
            <option value="">Select Skill</option>
        `;

        validSkills.forEach(function(skill) {

            const selected =
                skill.toLowerCase() === selectedSkill.toLowerCase()
                ? "selected"
                : "";

            html += `
                <option value="${skill}" ${selected}>
                    ${skill}
                </option>
            `;
        });

        return html;
    }


    /*
     * ============================================================
     * ADD SKILL ROW
     * ============================================================
     */

    function addSkillRow(skill = "", level = "Beginner") {

        const container =
            document.getElementById("skillsContainer");

        const row =
            document.createElement("div");

        row.className = "skill-row";

        row.innerHTML = `

            <select class="skill-select">
                ${createSkillOptions(skill)}
            </select>

            <select class="level-select">

                <option value="Beginner"
                    ${level === "Beginner" ? "selected" : ""}>
                    Beginner
                </option>

                <option value="Intermediate"
                    ${level === "Intermediate" ? "selected" : ""}>
                    Intermediate
                </option>

                <option value="Advanced"
                    ${level === "Advanced" ? "selected" : ""}>
                    Advanced
                </option>

            </select>

            <button
                type="button"
                class="remove-btn"
                onclick="this.parentElement.remove()">
                ×
            </button>
        `;

        container.appendChild(row);
    }


    /*
     * ============================================================
     * GET SELECTED SKILLS
     * ============================================================
     */

    function getSelectedSkills() {

        const rows =
            document.querySelectorAll(".skill-row");

        const skills = [];

        rows.forEach(function(row) {

            const skill =
                row.querySelector(".skill-select").value;

            const level =
                row.querySelector(".level-select").value;

            if (skill) {

                skills.push({
                    name: skill,
                    level: level
                });
            }
        });

        return skills;
    }


    /*
     * ============================================================
     * SAVE PROFILE
     *
     * IMPORTANT:
     * First checks localStorage.
     * If userId is missing, checks server session/cookie.
     * ============================================================
     */

    async function saveProfile() {

        const message =
            document.getElementById("message");

        message.textContent = "";
        message.style.color = "";


        /*
         * STEP 1:
         * Try localStorage
         */

        let userId =
            localStorage.getItem("userId");


        /*
         * STEP 2:
         * If localStorage does not have userId,
         * ask the server who is logged in.
         */

        if (
            !userId ||
            userId === "undefined" ||
            userId === "null"
        ) {

            try {

                const sessionResponse =
                    await fetch("/api/session", {
                        method: "GET",
                        credentials: "include"
                    });


                const sessionData =
                    await sessionResponse.json();


                if (
                    sessionResponse.ok &&
                    sessionData.success &&
                    sessionData.user &&
                    sessionData.user.id
                ) {

                    userId =
                        String(sessionData.user.id);


                    /*
                     * Save the recovered user information
                     * back into localStorage.
                     */

                    localStorage.setItem(
                        "userId",
                        userId
                    );

                    localStorage.setItem(
                        "userName",
                        sessionData.user.full_name || ""
                    );

                    localStorage.setItem(
                        "userEmail",
                        sessionData.user.email || ""
                    );

                    localStorage.setItem(
                        "isLoggedIn",
                        "true"
                    );
                }

            } catch (error) {

                console.error(
                    "Session check failed:",
                    error
                );
            }
        }


        /*
         * STEP 3:
         * Final user ID check
         */

        if (
            !userId ||
            userId === "undefined" ||
            userId === "null"
        ) {

            message.textContent =
                "Please login again before saving your profile.";

            message.style.color = "red";

            return;
        }


        /*
         * STEP 4:
         * Get profile information
         */

        const qualification =
            document.getElementById("qualification").value;

        const field =
            document.getElementById("field").value;

        const interest =
            document.getElementById("interest").value;


        /*
         * STEP 5:
         * Validate required fields
         */

        if (!qualification) {

            message.textContent =
                "Please select your qualification.";

            message.style.color = "red";

            return;
        }


        if (!field) {

            message.textContent =
                "Please select your field.";

            message.style.color = "red";

            return;
        }


        if (!interest) {

            message.textContent =
                "Please select your career interest.";

            message.style.color = "red";

            return;
        }


        /*
         * STEP 6:
         * Get selected skills
         */

        const skills =
            getSelectedSkills();


        /*
         * STEP 7:
         * Send profile to server
         */

        try {

            const response =
                await fetch("/api/profile", {

                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        userId:
                            Number(userId),

                        userEmail:
                            localStorage.getItem(
                                "userEmail"
                            ) || "",

                        qualification:
                            qualification,

                        field:
                            field,

                        interest:
                            interest,

                        skills:
                            skills
                    })
                });


            const data =
                await response.json();


            /*
             * STEP 8:
             * Check server response
             */

            if (
                !response.ok ||
                !data.success
            ) {

                message.textContent =
                    data.message ||
                    "Unable to save profile.";

                message.style.color = "red";

                return;
            }


            /*
             * STEP 9:
             * Success
             */

            message.textContent =
                "Profile saved successfully!";

            message.style.color = "green";


            /*
             * STEP 10:
             * Go to career recommendations
             */

            setTimeout(function() {

                window.location.href =
                    "career.html";

            }, 700);


        } catch (error) {

            console.error(
                "Profile save error:",
                error
            );

            message.textContent =
                "Unable to connect to the server.";

            message.style.color = "red";
        }
    }


    /*
     * ============================================================
     * LOAD EXISTING PROFILE
     * ============================================================
     */

    async function loadProfile() {

        let userId =
            localStorage.getItem("userId");


        /*
         * If localStorage is empty,
         * try the server session.
         */

        if (
            !userId ||
            userId === "undefined" ||
            userId === "null"
        ) {

            try {

                const response =
                    await fetch("/api/session", {
                        credentials: "include"
                    });

                const data =
                    await response.json();


                if (
                    response.ok &&
                    data.success &&
                    data.user &&
                    data.user.id
                ) {

                    userId =
                        String(data.user.id);

                    localStorage.setItem(
                        "userId",
                        userId
                    );

                    localStorage.setItem(
                        "userName",
                        data.user.full_name || ""
                    );

                    localStorage.setItem(
                        "userEmail",
                        data.user.email || ""
                    );

                    localStorage.setItem(
                        "isLoggedIn",
                        "true"
                    );
                }

            } catch (error) {

                console.error(
                    "Session loading failed:",
                    error
                );
            }
        }


        /*
         * If no user is logged in,
         * show one empty skill row.
         */

        if (
            !userId ||
            userId === "undefined" ||
            userId === "null"
        ) {

            addSkillRow();

            return;
        }


        try {

            const response =
                await fetch(
                    "/api/profile/" +
                    encodeURIComponent(userId),
                    {
                        credentials: "include"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                addSkillRow();

                return;
            }


            /*
             * Fill saved profile information
             */

            if (data.profile) {

                document.getElementById(
                    "qualification"
                ).value =
                    data.profile.qualification || "";

                document.getElementById(
                    "field"
                ).value =
                    data.profile.field || "";

                document.getElementById(
                    "interest"
                ).value =
                    data.profile.interest || "";


                /*
                 * Add saved skills
                 */

                const container =
                    document.getElementById(
                        "skillsContainer"
                    );

                container.innerHTML = "";


                if (
                    Array.isArray(
                        data.profile.skills
                    ) &&
                    data.profile.skills.length > 0
                ) {

                    data.profile.skills.forEach(
                        function(skill) {

                            /*
                             * Supports both:
                             * {name, level}
                             * and simple strings
                             */

                            if (
                                typeof skill === "object"
                            ) {

                                addSkillRow(
                                    skill.name || "",
                                    skill.level || "Beginner"
                                );

                            } else {

                                addSkillRow(
                                    String(skill),
                                    "Beginner"
                                );
                            }
                        }
                    );

                } else {

                    addSkillRow();
                }

            } else {

                addSkillRow();
            }


        } catch (error) {

            console.error(
                "Profile loading error:",
                error
            );

            addSkillRow();
        }
    }


    /*
     * ============================================================
     * LOGOUT
     * ============================================================
     */

    function logout() {

        localStorage.removeItem("userId");
        localStorage.removeItem("userName");
        localStorage.removeItem("userEmail");
        localStorage.removeItem("isLoggedIn");

        window.location.href =
            "login.html";
    }


    /*
     * ============================================================
     * PAGE LOAD
     * ============================================================
     */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            loadProfile();

        }
    );

</script>

</body>
</html>
